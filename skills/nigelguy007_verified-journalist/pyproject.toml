[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verified-journalist"
version = "0.1.0"
description = "A research-to-article agent that verifies every quote and citation against its sources before it lets an article through."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "trafilatura>=1.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
ui = ["streamlit>=1.35"]
all = ["anthropic>=0.40", "openai>=1.50", "streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
verified-journalist = "verified_journalist.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verified_journalist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
